name: Create and publish release artifacts
on:
  release:
    types: [ released ]
#See: https://docs.github.com/en/actions/learn-github-actions/workflow-syntax-for-github-actions#example-using-multiple-events-with-activity-types-or-configuration

defaults:
  run:
    shell: bash

jobs:

  upload_artifacts:
    name: Upload archives
    concurrency: upload
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: c-py/action-dotenv-to-setenv@v5
        with:
          env-file: .github/variables/.env
      - uses: FranzDiebold/github-env-vars-action@v2.8.0 #https://github.com/marketplace/actions/github-environment-variables-action
      
      - name: Set build version number env variables
        run: .github/scripts/set_release_version_numbers_env.sh

      - name: Update project version & build number in source code and documentation
        run: .github/scripts/update_project_version.sh

      - name: Setup git config
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Update CHANGELOG.md with release notes
        env:
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_DATE: ${{ github.event.release.published_at }}
          TARGET_BRANCH: ${{ github.event.release.target_commitish }}
          GH_TOKEN: ${{ secrets.ELEVATED_TOKEN }}
        run: |
          # Configure git to use the elevated token
          git config --global credential.helper store
          echo "https://x-access-token:${GH_TOKEN}@github.com" > ~/.git-credentials
          python3 - <<'PYEOF'
          import os

          tag = os.environ['RELEASE_TAG']
          body = os.environ['RELEASE_BODY'].strip()
          date = os.environ['RELEASE_DATE'][:10]

          new_section = f"## [{tag}] - {date}\n\n{body}\n\n---\n\n"

          with open('CHANGELOG.md', 'r') as f:
              content = f.read()

          marker = '\n---\n'
          pos = content.index(marker) + len(marker)
          updated = content[:pos] + '\n' + new_section + content[pos:]

          with open('CHANGELOG.md', 'w') as f:
              f.write(updated)

          print(f"Added {tag} to CHANGELOG.md")
          PYEOF
          git add CHANGELOG.md
          git commit -m "Add release notes for ${RELEASE_TAG} to CHANGELOG.md [skip ci]"
          git push origin HEAD:"${TARGET_BRANCH}"

      - name: Build and publish documentation
        run: |
          pip install mkdocs
          pip install mkdocs-git-revision-date-localized-plugin
          pip install mkdocs-material
          pip install git+https://github.com/jimporter/mike.git
          mike deploy -p -u ${UTPLSQL_VERSION} latest
          mkdocs build --clean -f mkdocs_offline.yml         
          rm -rf docs/* 
          cp -r -v site/* docs
          git add .
          git commit -m "tmp commit of HTML documentation for building a release archive"

      - name: Build release archives
        run: |
          git archive --prefix=utPLSQL/ -o utPLSQL.zip    --format=zip    HEAD
          git archive --prefix=utPLSQL/ -o utPLSQL.tar.gz --format=tar.gz HEAD
          md5sum utPLSQL.zip  --tag > utPLSQL.zip.md5
          md5sum utPLSQL.tar.gz  --tag > utPLSQL.tar.gz.md5

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            utPLSQL.zip
            utPLSQL.zip.md5
            utPLSQL.tar.gz
            utPLSQL.tar.gz.md5

      - name: Post release announcement to org discussions
        env:
          GH_TOKEN: ${{ secrets.ORG_DISCUSSION_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_URL: ${{ github.event.release.html_url }}
        run: |
          ORG="utPLSQL"

          ORG_DATA=$(gh api graphql -f query='query($org: String!) {
            organization(login: $org) {
              id
              discussionCategories(first: 20) {
                nodes { id name }
              }
            }
          }' -f org="$ORG")

          ORG_ID=$(echo "$ORG_DATA" | jq -r '.data.organization.id')
          CATEGORY_ID=$(echo "$ORG_DATA" | jq -r \
            '.data.organization.discussionCategories.nodes[] | select(.name == "Announcements") | .id')

          BODY="${RELEASE_BODY}

          ---
          [View full release on GitHub](${RELEASE_URL})"

          DISCUSSION_URL=$(gh api graphql -f query='mutation($orgId: ID!, $categoryId: ID!, $title: String!, $body: String!) {
            createDiscussion(input: {
              organizationId: $orgId,
              categoryId: $categoryId,
              title: $title,
              body: $body
            }) {
              discussion { url }
            }
          }' \
            -f orgId="$ORG_ID" \
            -f categoryId="$CATEGORY_ID" \
            -f title="utPLSQL ${RELEASE_TAG} released" \
            -f body="$BODY" \
            --jq '.data.createDiscussion.discussion.url')

          echo "Announcement posted: $DISCUSSION_URL"

